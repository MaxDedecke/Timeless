services:
  # Einzig veröffentlichter Dienst – alles andere läuft nur im Compose-Netz.
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_ORIGIN: http://backend:3000
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      PORT: "3000"
      # DB-Zugriff ausschließlich über den Compose-Servicenamen.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: timeless
      PGUSER: timeless
      PGPASSWORD: timeless
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timeless
      POSTGRES_USER: timeless
      POSTGRES_PASSWORD: timeless
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeless -d timeless"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
